<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>cdn muiboi</title>

  <!-- Load stylesheet from jsDelivr CDN -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/TheAlphaLeopard/nunyabuiness@main/theme/love.css">

</head>
<body>
  <center>
    <div>
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()" width="100%" height="100%"></canvas>
    </div>
  </center>

  <script type='text/javascript'>
    window.callad = () => {
      window.parent.postMessage({ type: 'adcall' }, '*');
    }

    var canvas = document.getElementById("loadingCanvas");
    canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

    function drawLoadingText(text) {
      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      var canvas = loadingContext.canvas;
      loadingContext.fillStyle = "rgb(142, 195, 227)";
      loadingContext.fillRect(0, 0, canvas.scrollWidth, canvas.scrollHeight);
      loadingContext.font = '2em arial';
      loadingContext.textAlign = 'center'
      loadingContext.fillStyle = "rgb( 11, 86, 117 )";
      loadingContext.fillText(text, canvas.scrollWidth / 2, canvas.scrollHeight / 2);
    }

    // Module configuration (point file package prefix to CDN)
    var Module = {
      filePackagePrefixURL: 'https://cdn.jsdelivr.net/gh/TheAlphaLeopard/nunyabuiness@main/',
      arguments: ["./game.love"],
      INITIAL_MEMORY: 256000000,
      printErr: console.error.bind(console),
      canvas: (function() { var c = document.getElementById('canvas'); c.addEventListener("webglcontextlost", function(e){ alert('WebGL context lost. Reload the page.'); e.preventDefault(); }, false); return c; })(),
      setStatus: function(text) { if (text) { drawLoadingText(text); } else if (Module.remainingDependencies === 0) { document.getElementById('loadingCanvas').style.display = 'none'; document.getElementById('canvas').style.visibility = 'visible'; } },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) { this.remainingDependencies = left; this.totalDependencies = Math.max(this.totalDependencies, left); Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.'); }
    };
    Module.setStatus('Downloading...');

    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) { if (text) Module.printErr('[post-exception status] ' + text); };
    };

    var applicationLoad = function(e) { Love(Module); };
  </script>

  <!-- console wrapper from CDN -->
  <script src="https://cdn.jsdelivr.net/gh/TheAlphaLeopard/nunyabuiness@main/consolewrapper.js"></script>

  <!-- game data loader and runtime from CDN -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/TheAlphaLeopard/nunyabuiness@main/game.js"></script>
  <script async type="text/javascript" src="https://cdn.jsdelivr.net/gh/TheAlphaLeopard/nunyabuiness@main/love.js" onload="applicationLoad(this)"></script>

</body>
</html>
